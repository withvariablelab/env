<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" style="--br:#8a8a92;--e:#34d399;--scope:#8a8a92;--name:#ededed;">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; }
    .br { fill: var(--br); }
    .e  { fill: var(--e); }
    .scope { font-family: 'Inter Tight', system-ui, sans-serif; font-weight: 400; fill: var(--scope, var(--br)); }
    .name  { font-family: 'Inter Tight', system-ui, sans-serif; font-weight: 600; fill: var(--name, var(--e)); }
  </style>

  
  <text x="180" y="156" text-anchor="middle" font-size="124" letter-spacing="-3.7199999999999998">
    <tspan class="br">{</tspan><tspan class="e">e</tspan><tspan class="br">}</tspan>
  </text>
  <line x1="320" y1="60" x2="320" y2="180" stroke="#8a8a92" stroke-opacity="0.4" stroke-width="1"/>
  <text x="356" y="108" class="scope" font-size="20" letter-spacing="0.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#8a8a92">@variablelab</text>
  <text x="356" y="160" class="name" font-size="56" letter-spacing="-1.8" fill="#ededed">env</text>
</svg>