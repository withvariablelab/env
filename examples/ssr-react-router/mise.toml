[tools]
node = "24"
pnpm = "10.30.3"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.setup]
description = "Pack env + install deps (pnpm) + generate React Router route types"
depends = ["//:env:pack"]
sources = [
  "package.json",
  "pnpm-lock.yaml",
  "{{config_root}}/../../package/.local/variablelab-env.tgz",
]
outputs = ["node_modules/.modules.yaml"]
run = [
  "pnpm install --ignore-workspace --no-frozen-lockfile",
  "react-router typegen",
]

[tasks.reinstall]
description = "Force-reinstall the env tarball"
depends = ["//:env:pack"]
run = [
  "pnpm install --ignore-workspace --no-frozen-lockfile --force",
  "react-router typegen",
]

[tasks.dev]
depends = ["setup"]
run = "react-router dev"

[tasks.build]
depends = ["setup"]
run = "react-router build"

[tasks.start]
depends = ["setup"]
run = "react-router-serve build/server/index.js"

[tasks."test:e2e"]
depends = ["setup"]
run = "playwright test"

[tasks.check]
description = "JS & TS check"
depends = ["setup"]
run = "rr check"
