# The bun that the weekly dependency audit runs: `bun audit` needs bun >= 1.2.15, and the bun
# examples pin 1.2.4 on purpose. `MISE_ENV=audit` adds it to the root tools, as the audit does.
# To bump it, pick a release at least 24 h old, then run
# `MISE_ENV=audit mise lock -p linux-x64,linux-x64-musl,linux-arm64,linux-arm64-musl,macos-x64,macos-arm64,windows-x64 bun`.
[tools]
bun = "1.4.3"
