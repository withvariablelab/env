min_version = "2026.10.19"
monorepo_root = true

[env]
MISE_EXPERIMENTAL = "1"
_.path = ["{{config_root}}/node_modules/.bin"]

[tools]
gitleaks = "8.30.1"
node = "24"
pnpm = "12.16.1"

[settings]
lockfile = true

[monorepo]
config_roots = [
  "examples/*",
]

[tasks.setup]
description = "Bootstrap everything: tools, root deps, env tarball, examples, playwright"
run = [
  "mise install",
  "for d in examples/*/; do mise install -C \"$d\"; done",
  "pnpm install",
  "mise run \"//examples/...:setup\"",
  "mise run playwright:install",
]

[tasks."env:pack"]
description = "Build @variablelab/env and pack it into package/.local/variablelab-env.tgz"
dir = "{{config_root}}/package"
# ../pnpm-workspace.yaml: pnpm pack writes the catalog's versions into the packed package.json.
sources = ["src/**/*", "package.json", "tsdown.config.ts", "../pnpm-workspace.yaml"]
outputs = [".local/variablelab-env.tgz"]
run = [
  "rr pack",
  "mkdir -p .local",
  "pnpm pack --pack-destination .local",
  "mv .local/variablelab-env-*.tgz .local/variablelab-env.tgz",
]

[tasks."env:watch"]
description = "Rebuild + repack on every change in package/src and bump examples"
dir = "{{config_root}}/package"
run = "pnpm dlx chokidar-cli 'src/**/*' --ignore 'dist/**' -c 'mise run env:pack && mise run examples:bump'"

[tasks."examples:relock"]
description = "Relock the pnpm examples on the env tarball this checkout packs"
depends = ["env:pack"]
run = 'for lock in examples/*/pnpm-lock.yaml; do pnpm --dir "${lock%/*}" install --ignore-workspace --lockfile-only --config.strict-dep-builds=false; done'

[tasks."release:version"]
description = "The release job's version step: bump the versions, then relock the examples on the new package"
run = ["pnpm changeset version", "mise run examples:relock"]

[tasks."examples:bump"]
description = "Reinstall the local env tarball in every example"
run = "mise run \"//examples/...:reinstall\""

[tasks."playwright:install"]
description = "Install Playwright chromium browser globally (one-time, idempotent)"
run = "pnpm dlx playwright@1.59.1 install --with-deps chromium"

[tasks."test:e2e"]
description = "Run e2e suites for every example"
depends = ["env:pack"]
run = "mise run \"//examples/...:test:e2e\""

[tasks."examples:check"]
description = "JS & TS check across every example"
depends = ["env:pack"]
run = "mise run \"//examples/...:check\""

[tasks.docsite]
description = "Start the docs site dev server"
run = "pnpm --filter=docsite dev"

[tasks."lib:test"]
description = "Unit tests for @variablelab/env"
dir = "{{config_root}}/package"
run = "vitest run"

[tasks."lib:build"]
description = "Build @variablelab/env"
dir = "{{config_root}}/package"
run = "rr pack"

[tasks.check]
description = "JS & TS check across the workspace (package + docsite)"
run = "rr check"
