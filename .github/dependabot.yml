# Dependabot security updates only. Version updates stay manual: open-pull-requests-limit: 0
# turns them off, while security updates still open PRs for every new alert.
# cooldown mirrors pnpm's minimumReleaseAge (24 h). GitHub applies it to version updates only,
# so it does not delay security PRs: check the fixed version's age before merging one.
version: 2
updates:
  - package-ecosystem: npm
    # The root workspace plus every pnpm example (each has its own lockfile). The bun examples
    # (backend-bun, backend-bun-cjs, backend-deno, backend-deno-cjs) are left out: Dependabot has
    # no security updates for bun.lock. The weekly dependency audit covers them instead.
    directories:
      - "/"
      - "/examples/backend-node"
      - "/examples/backend-node-cjs"
      - "/examples/edge-nextjs"
      - "/examples/spa-vite-dynamic"
      - "/examples/spa-vite-plugin"
      - "/examples/ssr-react-router"
      - "/examples/ssr-tanstack-start"
      - "/examples/worker-cloudflare"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 1
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 1
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
