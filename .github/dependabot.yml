# Dependabot security updates only. open-pull-requests-limit: 0 turns version updates off; security
# updates, once enabled in the repo's code security settings, open a PR for each new alert.
# cooldown mirrors pnpm's minimumReleaseAge (24 h), but it only delays version updates. Security PRs
# skip both: GitHub ignores cooldown for them, and Dependabot runs pnpm with
# --config.minimumReleaseAge=0 (dependabot-core#15170). Check the fixed version's age before merging.
version: 2
updates:
  - package-ecosystem: npm
    # The root workspace plus every pnpm example (each has its own lockfile). The bun examples
    # (backend-bun, backend-bun-cjs, backend-deno, backend-deno-cjs) are left out: Dependabot has
    # no security updates for bun.lock. The weekly dependency audit covers them instead.
    directories:
      - "/"
      - "/examples/backend-node"
      - "/examples/backend-node-cjs"
      - "/examples/edge-nextjs"
      - "/examples/spa-vite-dynamic"
      - "/examples/spa-vite-plugin"
      - "/examples/ssr-react-router"
      - "/examples/ssr-tanstack-start"
      - "/examples/worker-cloudflare"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 1
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 1
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
