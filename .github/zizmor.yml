rules:
  dependabot-cooldown:
    config:
      # Matches pnpm's minimumReleaseAge (1440 minutes) in pnpm-workspace.yaml.
      days: 1
  unpinned-uses:
    config:
      policies:
        # First-party actions are tracked at @main; their main is protected by rulesets.
        "withvariablelab/*": ref-pin
        "*": hash-pin
    ignore:
      # Generated by the Pullfrog app, not edited here.
      - pullfrog.yml
  artipacked:
    ignore:
      # Generated by the Pullfrog app, not edited here.
      - pullfrog.yml
