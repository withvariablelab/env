rules:
  unpinned-uses:
    config:
      policies:
        # First-party: withvariablelab/gh-actions is tracked at @main on
        # purpose (same policy as
        # withvariablelab/gh-actions itself). Its main is protected by
        # rulesets (PR required, signed commits, no force-push or deletion).
        "withvariablelab/*": ref-pin
        # Everything else must be pinned to a full commit SHA.
        "*": hash-pin
