name: Docsite

on:
  # Disabled on push/PR for now — the Lighthouse SEO audit is too slow and
  # needs a rework. Run manually via the Actions tab in the meantime.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  seo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      MISE_EXPERIMENTAL: "1"
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true
          experimental: true

      - name: 📦 Install root workspace
        run: pnpm install --frozen-lockfile

      - name: 💾 Cache pnpm dlx (Lighthouse CI)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pnpm/dlx
          key: pnpm-dlx-${{ runner.os }}-lhci-0.14.0

      - name: 🌐 Setup Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3

      - name: 🔎 SEO audit (Lighthouse CI)
        timeout-minutes: 12
        run: pnpm --filter docsite check:seo

      - name: 📤 Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouseci-report
          path: docsite/.lighthouseci/**
          retention-days: 14
          if-no-files-found: ignore
