name: Docsite

on:
  # Manual only until the slow Lighthouse audit is reworked.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  seo:
    name: Audit SEO
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      MISE_EXPERIMENTAL: "1"
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
          experimental: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 💾 Cache Lighthouse CI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pnpm/dlx
          key: pnpm-dlx-${{ runner.os }}-lhci-0.14.0

      - name: 🌐 Setup Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3

      - name: 🔎 Run SEO audit
        timeout-minutes: 12
        run: pnpm --filter docsite check:seo

      - name: 📤 Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouseci-report
          path: docsite/.lighthouseci/**
          retention-days: 14
          if-no-files-found: ignore
