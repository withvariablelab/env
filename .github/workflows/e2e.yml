name: E2E

on:
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - "package/**"
      - ".github/workflows/e2e.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "mise.lock"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "examples/**"
      - "package/**"
      - ".github/workflows/e2e.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "mise.lock"

permissions: {}

jobs:
  test:
    name: E2E ${{ matrix.example }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Browser examples use the Playwright image; others the bare runner (keeps bun/deno untouched).
    container: ${{ matrix.browser && 'mcr.microsoft.com/playwright:v1.59.1-noble' || '' }}
    timeout-minutes: 12
    env:
      MISE_EXPERIMENTAL: "1"
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.example }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: backend-node, browser: false }
          - { example: backend-bun, browser: false }
          - { example: backend-deno, browser: false }
          - { example: backend-node-cjs, browser: false }
          - { example: backend-bun-cjs, browser: false }
          - { example: backend-deno-cjs, browser: false }
          - { example: worker-cloudflare, browser: false }
          - { example: edge-nextjs, browser: false }
          - { example: spa-vite-dynamic, browser: true }
          - { example: spa-vite-plugin, browser: true }
          - { example: ssr-react-router, browser: true }
          - { example: ssr-tanstack-start, browser: true }
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install: true
          cache: true
          # Only this example's tools and the root's: v5 would add --monorepo and install every example's.
          monorepo: false
          experimental: true
          working_directory: examples/${{ matrix.example }}

      - name: 📦 Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎁 Pack @variablelab/env
        run: mise run env:pack

      - name: 🧩 Run e2e tests
        timeout-minutes: 5
        run: mise run //examples/${{ matrix.example }}:test:e2e
