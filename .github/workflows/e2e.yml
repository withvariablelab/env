name: E2E

on:
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - "package/**"
      - ".github/workflows/e2e.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "examples/**"
      - "package/**"
      - ".github/workflows/e2e.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"

jobs:
  test:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    # Browser examples run inside the official Playwright image (browsers
    # pre-baked, no download); non-browser examples run on the bare runner so
    # their bun/deno toolchains stay untouched. Empty string ⇒ no container.
    container: ${{ matrix.browser && 'mcr.microsoft.com/playwright:v1.59.1-noble' || '' }}
    timeout-minutes: 12
    env:
      MISE_EXPERIMENTAL: "1"
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.example }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: backend-node,        browser: false }
          - { example: backend-bun,         browser: false }
          - { example: backend-deno,        browser: false }
          - { example: worker-cloudflare,   browser: false }
          - { example: edge-nextjs,         browser: false }
          - { example: spa-vite-dynamic,    browser: true  }
          - { example: spa-vite-plugin,     browser: true  }
          - { example: ssr-react-router,    browser: true  }
          - { example: ssr-tanstack-start,  browser: true  }
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🛠️ Setup mise (root + example tools)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          experimental: true
          working_directory: examples/${{ matrix.example }}

      - name: 📦 Install root workspace (for env:pack)
        run: pnpm install --frozen-lockfile

      - name: 🎁 Pack @variablelab/env
        run: mise run env:pack

      - name: 🧩 Test e2e
        timeout-minutes: 5
        run: mise run //examples/${{ matrix.example }}:test:e2e
