# Test PRs and main; release from main; publish previews for feat/fix PRs.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN is read-only in withvariablelab; every job asks for
# exactly what it needs below.
permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Run inside the official Playwright image: browsers (chromium v1217 for
    # playwright 1.59.1) are pre-baked, so the lib browser tests need no
    # `playwright install` download.
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MISE_EXPERIMENTAL: "1"
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true
          experimental: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 💅 Lint and typecheck
        run: mise run check

      - name: 🧪 Run unit tests
        run: mise run lib:test

      - name: 🔨 Build library
        run: mise run lib:build

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) for `changeset publish`
    steps:
      # The Version Packages PR and its commits are made by vland-bot (not
      # GITHUB_TOKEN) so that PR runs CI. The token only covers this repo.
      - name: 🔑 Mint vland-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VLAND_BOT_CLIENT_ID }}
          private-key: ${{ secrets.VLAND_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true
          experimental: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # Identity of the app's bot user, derived from the token (pattern from
      # the create-github-app-token README) instead of a hardcoded user id.
      - name: 🧑‍💻 Configure git user
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: 🚀 Release or version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          commitMode: github-api
          commit: "chore: update versions"
          title: "chore: update versions"
          publish: pnpm changeset publish
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          LEFTHOOK: 0

  # Job 1 of the two-job preview: runs the PR code and publishes it with npm
  # OIDC. No app key here; it only hands the published package list on.
  preview:
    name: Publish preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ startsWith(github.head_ref, 'feat') || startsWith(github.head_ref, 'fix') || contains(github.event.pull_request.labels.*.name, 'preview') }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    outputs:
      packages: ${{ steps.preview.outputs.packages }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: ⌛ Setup pnpm
        uses: withvariablelab/gh-actions/actions/setup-pnpm@main

      - name: 🚀 Publish preview
        id: preview
        uses: withvariablelab/gh-actions/actions/monorepo-preview-release@main
        with:
          mode: publish
          publish_mode: oidc-only
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Job 2 of the two-job preview: never checks out or runs PR code. The
  # reusable workflow mints the vland-bot token (this repo only,
  # pull-requests: write) and upserts the PR comment. `packages` comes from a
  # job that ran PR code, so it is untrusted: it only travels through
  # `outputs:`/`with:` and is validated by the action, never put in a `run:`.
  preview-comment:
    name: Comment preview
    needs: preview
    if: ${{ needs.preview.result == 'success' }}
    permissions: {}
    uses: withvariablelab/gh-actions/.github/workflows/preview-comment.yml@main
    with:
      action: monorepo-preview-release
      packages: ${{ needs.preview.outputs.packages }}
    secrets:
      VLAND_BOT_PRIVATE_KEY: ${{ secrets.VLAND_BOT_PRIVATE_KEY }}
