name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

# Each label run gets a group of its own, so labels added at once can't cancel the run GitHub reads "Test" from.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    # Playwright image: browsers come pre-installed.
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MISE_EXPERIMENTAL: "1"
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install: true
          cache: true
          # Only the root's tools: v5 would add --monorepo and install every example's too.
          monorepo: false
          experimental: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 💅 Lint and typecheck
        run: mise run check

      - name: 🧪 Run unit tests
        run: mise run lib:test

      - name: 🔨 Build library
        run: mise run lib:build

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install_args: gitleaks
          cache: true

      - name: 🔐 Scan the new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: gitleaks git --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA"

  # The ruleset requires a check named "Test": this job reports the checks and the secret scan under that name.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [check, secrets]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: ✅ The checks passed and no secret leaked
        env:
          CHECK: ${{ needs.check.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: test "$CHECK" = "success" && test "$SECRETS" = "success"

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) for `changeset publish`
    steps:
      - name: 🔑 Mint vland-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.VLAND_BOT_CLIENT_ID }}
          private-key: ${{ secrets.VLAND_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install: true
          cache: true
          # Only the root's tools: v5 would add --monorepo and install every example's too.
          monorepo: false
          experimental: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧑‍💻 Configure git user
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: 🚀 Release or version PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          # The examples lock the packed tarball's version and integrity: relock them in the same PR.
          version-script: mise run release:version
          publish-script: pnpm changeset publish
        env:
          LEFTHOOK: 0

  # Runs PR code: never give this job the bot key.
  preview:
    name: Publish preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A feat/fix branch publishes on opened, synchronize and reopened. Any other branch publishes from the label run
    # that adds `preview` (a PR opened with it gets one too), then on synchronize and reopened while it has it.
    if: >-
      ${{ (github.event.action == 'labeled'
        && github.event.label.name == 'preview'
        && !startsWith(github.head_ref, 'feat') && !startsWith(github.head_ref, 'fix'))
      || (github.event.action != 'labeled'
        && (startsWith(github.head_ref, 'feat') || startsWith(github.head_ref, 'fix')
          || (github.event.action != 'opened' && contains(github.event.pull_request.labels.*.name, 'preview')))) }}
    # One publish to `pr-<number>` at a time: label runs don't share the workflow's group.
    concurrency:
      group: ${{ github.workflow }}-preview-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    env:
      MISE_EXPERIMENTAL: "1"
    outputs:
      packages: ${{ steps.preview.outputs.packages }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install: true
          cache: true
          # Only the root's tools: v5 would add --monorepo and install every example's too.
          monorepo: false
          experimental: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Publish preview
        id: preview
        uses: withvariablelab/gh-actions/actions/monorepo-preview-release@main
        with:
          mode: publish
          publish_mode: oidc-only
          github_token: ${{ secrets.GITHUB_TOKEN }}

  preview-comment:
    name: Comment preview
    needs: preview
    if: ${{ needs.preview.result == 'success' }}
    permissions: {}
    uses: withvariablelab/gh-actions/.github/workflows/preview-comment.yml@main
    with:
      action: monorepo-preview-release
      packages: ${{ needs.preview.outputs.packages }}
    secrets:
      VLAND_BOT_PRIVATE_KEY: ${{ secrets.VLAND_BOT_PRIVATE_KEY }}
