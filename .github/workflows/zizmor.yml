name: zizmor

# Security lint for this repo's workflows (template injection, credential
# persistence, unpinned actions, excessive permissions...).
# Config: .github/zizmor.yml

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pipx ships with the GitHub-hosted Ubuntu image, so no third-party
      # setup action is needed.
      - name: 🔒 Run zizmor
        run: pipx run --spec zizmor==1.30.1 zizmor --format=github .github/
        env:
          # Enables the online audits (impostor commits, known-vulnerable
          # actions, ref confusion). Read-only: the job has contents: read.
          GH_TOKEN: ${{ github.token }}
