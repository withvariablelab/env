packages:
  - package
  - docsite

catalog:
  "@rrlab/ts-config": 0.0.6
  "@rrlab/tsdown-config": 0.2.1
  "@types/node": 26.6.6
  "@types/react": 19.2.14
  "@types/react-dom": 19.2.3
  "@vitejs/plugin-react": 6.0.1
  react: 19.2.4
  react-dom: 19.2.4
  typescript: 7.0.2
  vite: 8.3.4
  zod: 4.6.7

allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true

sideEffectsCache: false

publicHoistPattern:
  - "@total-typescript/*"

# Supply-chain cooldown: malicious releases are usually pulled within 24h.
# The pnpm examples install with --ignore-workspace, which skips this file: pnpm's default cooldown, also a day, applies to them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@variablelab/*"
  - "@rrlab/*"
  - "@variableland/*"
