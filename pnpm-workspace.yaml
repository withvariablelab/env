packages:
  - package
  - docsite

catalog:
  "@rrlab/ts-config": 0.0.2
  "@rrlab/tsdown-config": 0.1.0
  "@types/node": 24.12.4
  "@types/react": 19.2.14
  "@types/react-dom": 19.2.3
  "@vitejs/plugin-react": 6.0.1
  react: 19.2.4
  react-dom: 19.2.4
  typescript: 6.0.3
  vite: 8.0.11
  zod: 4.3.6

onlyBuiltDependencies:
  - "@biomejs/biome"
  - lefthook
  - esbuild

publicHoistPattern:
  - "@total-typescript/*"

# Supply-chain guard: don't resolve versions published less than 24h ago
# (most malicious releases are pulled within the hour). Our own scopes are
# exempt so freshly released @variablelab/* and @rrlab/* can be picked up.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@variablelab/*"
  - "@rrlab/*"
