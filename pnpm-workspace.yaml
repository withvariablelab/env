packages:
  - package
  - docsite

catalog:
  "@rrlab/ts-config": 0.0.3
  "@rrlab/tsdown-config": 0.1.1
  "@types/node": 24.12.4
  "@types/react": 19.2.14
  "@types/react-dom": 19.2.3
  "@vitejs/plugin-react": 6.0.1
  react: 19.2.4
  react-dom: 19.2.4
  typescript: 6.0.3
  vite: 8.3.4
  zod: 4.3.6

onlyBuiltDependencies:
  - "@biomejs/biome"
  - lefthook
  - esbuild

publicHoistPattern:
  - "@total-typescript/*"

# Supply-chain cooldown: malicious releases are usually pulled within 24h; pattern excludes need pnpm >= 10.17.
# The pnpm examples install with --ignore-workspace, which skips this file, so each carries the same values in its own .npmrc.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@variablelab/*"
  - "@rrlab/*"
